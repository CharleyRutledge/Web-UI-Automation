[pytest]
# Self-tests for the framework itself (run: python -m pytest -c selftests/pytest.ini).
# Using this file makes selftests/ the rootdir, so the UI suite's conftest.py (reports, notifications)
# is not loaded here; the CLI tests start that suite as a real subprocess instead.
testpaths = .
pythonpath = . ..
addopts = -ra -m "not load and not live"
markers =
    load: load / performance tests (nightly)
    live: talks to the real Telegram / Anthropic / playwright.dev (weekly or on demand)
filterwarnings =
    # The login-only SMTP test server deliberately allows AUTH without TLS.
    ignore:Requiring AUTH while not requiring TLS:UserWarning

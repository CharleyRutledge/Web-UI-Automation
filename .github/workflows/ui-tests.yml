name: UI tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      # v7 actions run on Node 24; the v4/v5 ones ran on deprecated Node 20 and printed the
      # "punycode module is deprecated" warnings.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          # ffmpeg turns Playwright's WebM recordings into MP4 so videos also play on iPhone/Safari.
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run UI tests
        run: python -m ui_automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}

      # reports/latest is a copy of the run folder, so it is excluded to avoid uploading everything twice.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            reports/*/summary.html
            reports/*/report.html
            reports/*/summary.json
            reports/*/claude_summary.txt
            !reports/latest/**
          if-no-files-found: warn

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-videos
          path: |
            reports/*/videos/**
            !reports/latest/**
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: |
            reports/*/screenshots/**
            reports/*/failure-screenshots/**
            !reports/latest/**
          if-no-files-found: warn

      # Traces are kept for failed tests only (artifacts.tracing: retain-on-failure), so a green run has none.
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            reports/*/traces/**
            !reports/latest/**
          if-no-files-found: ignore

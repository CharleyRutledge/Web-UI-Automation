name: Site audit

# Whole-site audit (site_audit/ + Irish/EU website requirements) of the site in a config file.
# Weekly for statespend.ie; any other config/<site>.yaml can be run on demand.
on:
  schedule:
    - cron: "37 6 * * 1"   # weekly, Mondays (UTC)
  workflow_dispatch:
    inputs:
      config:
        description: Settings file for the site to audit
        default: config/statespend.yaml
  push:
    paths:
      - site_audit/**
      - ui_automation/**
      - config/statespend.yaml
      - .github/workflows/site-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true
      SITE_CONFIG: ${{ inputs.config || 'config/statespend.yaml' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Audit the site
        run: |
          # Only settings files from this repository's config/ folder.
          case "$SITE_CONFIG" in config/*.yaml) ;; *) echo "config must be config/<name>.yaml"; exit 2;; esac
          case "$SITE_CONFIG" in *..*) echo "config must be config/<name>.yaml"; exit 2;; esac
          python -m ui_automation --config "$SITE_CONFIG" -- site_audit tests/test_compliance.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Upload report, videos, screenshots and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-audit-report
          path: |
            reports/*/summary.html
            reports/*/report.html
            reports/*/summary.json
            reports/*/claude_summary.txt
            reports/*/videos/**
            reports/*/screenshots/**
            reports/*/failure-screenshots/**
            reports/*/traces/**
            !reports/latest/**
          if-no-files-found: warn

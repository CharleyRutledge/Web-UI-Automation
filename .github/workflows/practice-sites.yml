name: Practice sites

# The public automation-practice websites (practice_sites/). They are other people's sites, so this
# runs weekly and on demand instead of gating pull requests.
on:
  schedule:
    - cron: "29 6 * * 1"   # weekly, Mondays (UTC)
  workflow_dispatch:
  push:
    paths:
      - practice_sites/**
      - config/practice-sites.yaml
      - .github/workflows/practice-sites.yml

permissions:
  contents: read

jobs:
  practice-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test the practice sites
        run: python -m ui_automation --config config/practice-sites.yaml -- practice_sites
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Upload report, videos, screenshots and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: practice-sites-report
          path: |
            reports/*/summary.html
            reports/*/report.html
            reports/*/summary.json
            reports/*/claude_summary.txt
            reports/*/videos/**
            reports/*/screenshots/**
            reports/*/failure-screenshots/**
            reports/*/traces/**
            !reports/latest/**
          if-no-files-found: warn

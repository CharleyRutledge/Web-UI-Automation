# Web UI automation defaults (override via WEB_UI_CONFIG or pytest --config)

base_url: "https://playwright.dev"
name: "playwright.dev UI tests"
browser: chromium
headless: true
timeout_ms: 30000
slow_mo_ms: 0

viewport:
  width: 1280
  height: 720

strict_selectors: true
screenshot_full_page: true

# Playwright artifacts (CI forces video: on)
artifacts:
  video: on
  tracing: retain-on-failure
  navigation_wait_until: domcontentloaded

# Claude Sonnet 5.5 — set ANTHROPIC_API_KEY and enabled: true
ai:
  enabled: true
  model: claude-sonnet-5-5
  max_tokens: 2048

# Accessibility of the site under test (axe-core, in the real browser).
# WCAG 2.1 AA is what EN 301 549 requires (EU Web Accessibility Directive, European Accessibility Act);
# wcag22aa adds the WCAG 2.2 criteria. fail_on: minor | moderate | serious | critical | none
accessibility:
  enabled: true
  standard: wcag21aa
  fail_on: none  # report only: playwright.dev is not our site. Use serious for a site you own.
  pages:
    - /
    - /docs/intro

# Irish / EU website requirements: privacy notice, cookie consent (no tracking before consent),
# accessibility statement, company details, contact details, terms. Off unless the site is yours.
compliance:
  enabled: true
  report_only: true  # playwright.dev is not our site: list problems, don't fail on them
  pages:
    - /
  checks: [privacy_notice, cookie_consent, accessibility_statement, company_details, contact_details]

notifications:
  email:
    enabled: false
    smtp_host: smtp.example.com
    smtp_port: 587
    smtp_user: "${EMAIL_SMTP_USER}"
    smtp_password: "${EMAIL_SMTP_PASSWORD}"
    use_tls: true
    from_addr: automation@example.com
    to_addrs:
      - qa-team@example.com
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

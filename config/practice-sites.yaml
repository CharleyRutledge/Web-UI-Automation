# Settings for the public practice-site suite (practice_sites/). Run it with:
#   python -m ui_automation --config config/practice-sites.yaml -- practice_sites
base_url: "https://the-internet.herokuapp.com"
name: "Practice sites (11)"
# Every page is checked in Chrome's engine, Firefox and WebKit (the engine Safari uses), one per run, taking
# turns by day (Irish date) so each run stays quick. --all-browsers runs all three at once (e.g. before a
# release). Missing browsers are installed automatically.
browsers: [chromium, firefox, webkit]
browser_rotation: daily
headless: true
timeout_ms: 30000

viewport:
  width: 1280
  height: 720

screenshot_full_page: false  # some of these pages are very long; the viewport is enough

artifacts:
  video: on
  tracing: retain-on-failure
  navigation_wait_until: domcontentloaded

ai:
  enabled: true
  model: claude-sonnet-5-5
  max_tokens: 2048

# Other people's sites: record every WCAG 2.1 AA finding in the report, but don't fail on them.
accessibility:
  enabled: true
  standard: wcag21aa
  fail_on: none

# Irish / EU website requirements of every site's home page: other people's sites, so report only.
compliance:
  enabled: true
  report_only: true

notifications:
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

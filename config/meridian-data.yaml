# Meridian Data, running on this computer. From the Web-UI-Automation folder:
#   python -m ui_automation --config config/meridian-data.yaml -- site_audit
# If the app: section below is filled in, the tests start Meridian Data first and stop it afterwards
# (unless it is already running: then it is tested as it is and left running). --no-start skips that.
# A different port? Change base_url, or add --url http://localhost:8080 for one run.
base_url: "http://localhost:8082"  # the Meridian Data front end (the API is on :3000, the database on :5433)
name: "Meridian Data (local)"
browser: chromium
headless: true
timeout_ms: 30000

viewport:
  width: 1280
  height: 720

screenshot_full_page: false

artifacts:
  video: on
  tracing: retain-on-failure
  navigation_wait_until: domcontentloaded

ai:
  enabled: true
  model: claude-sonnet-5-5
  max_tokens: 2048

# How to start and stop Meridian Data (remove the # to turn it on). The API and database run in Docker
# (Compose project local-infra); the front end on :8082 is what the tests open, so the start command has to
# bring that up too. If the front end is started separately, start everything yourself and leave this off.
# app:
#   start: "docker compose up -d --wait"
#   stop: "docker compose down"
#   start_in: "C:/Users/amkei/Repos/meridiandata-my-local-app/local-infra"
#   start_timeout: 180   # the first start may need to download or build images

# Your own app: serious accessibility problems fail their check, so they get fixed before release.
accessibility:
  enabled: true
  standard: wcag21aa
  fail_on: serious

# Irish / EU website requirements, checked on the home page before any cookie consent is given.
compliance:
  enabled: true
  report_only: false
  pages:
    - /
  checks: [privacy_notice, cookie_consent, accessibility_statement, contact_details]

audit:
  max_pages: 25
  load_budget_ms: 8000  # development servers build pages on first visit; the deployed app should be faster
  check_external_links: true
  security_checks: auto  # HTTPS and security headers are skipped on localhost; checked when deployed

notifications:
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

# Meridian Data, running on this computer. From the Web-UI-Automation folder:
#   python -m ui_automation --config config/meridian-data.yaml -- site_audit
# The app: section below starts the front end first and stops it afterwards (if it is already running,
# it is tested as it is and left running). --no-start never starts it.
# A different port? Change base_url, or add --url http://localhost:8080 for one run.
base_url: "http://localhost:8082"  # the Meridian Data front end (the API is on :3000, the database on :5433)
name: "Meridian Data (local)"
browser: chromium
headless: true
timeout_ms: 30000

viewport:
  width: 1280
  height: 720

screenshot_full_page: false

artifacts:
  video: on
  tracing: retain-on-failure
  navigation_wait_until: domcontentloaded

ai:
  enabled: true
  model: claude-sonnet-5-5
  max_tokens: 2048

# Starts the Meridian Data front end (Vite) if it is not already running, and stops it after the tests.
# The API and database stay in Docker (Compose project local-infra) and are not touched: start them yourself.
# (They run with an extra CORS file; restarting them from the folder alone would drop it.)
app:
  start: "npm run dev -- --port 8082 --strictPort"
  start_in: "C:/Users/amkei/Repos/meridiandata-my-local-app"
  start_timeout: 120

# Your own app: serious accessibility problems fail their check, so they get fixed before release.
accessibility:
  enabled: true
  standard: wcag21aa
  fail_on: serious

# Irish / EU website requirements, checked on the home page before any cookie consent is given.
compliance:
  enabled: true
  report_only: false
  pages:
    - /
  checks: [privacy_notice, cookie_consent, accessibility_statement, contact_details]

audit:
  max_pages: 25
  load_budget_ms: 8000  # development servers build pages on first visit; the deployed app should be faster
  check_external_links: true
  security_checks: auto  # HTTPS and security headers are skipped on localhost; checked when deployed

notifications:
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

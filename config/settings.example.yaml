base_url: "https://your-app.example.com"
name: "My site"  # shown on every report and Telegram message (default: the site's address)
browser: chromium
headless: true
timeout_ms: 30000
slow_mo_ms: 0

viewport:
  width: 1280
  height: 720

strict_selectors: true
screenshot_full_page: true

artifacts:
  video: on
  tracing: retain-on-failure
  navigation_wait_until: domcontentloaded

ai:
  enabled: true
  model: claude-sonnet-5-5
  max_tokens: 2048

# Accessibility of the site under test (axe-core, in the real browser).
# WCAG 2.1 AA is what EN 301 549 requires (EU Web Accessibility Directive, European Accessibility Act);
# wcag22aa adds the WCAG 2.2 criteria. fail_on: minor | moderate | serious | critical | none
accessibility:
  enabled: true
  standard: wcag21aa
  fail_on: serious
  pages:
    - /
    - /docs/intro

# Irish / EU website requirements: privacy notice, cookie consent (no tracking before consent),
# accessibility statement, company details, contact details, terms. Off unless the site is yours.
compliance:
  enabled: true
  report_only: false  # true: list problems in the report without failing (a site that isn't yours)
  pages:
    - /
  checks: [privacy_notice, cookie_consent, accessibility_statement, company_details, contact_details]

notifications:
  email:
    enabled: true
    smtp_host: smtp.gmail.com
    smtp_port: 587
    smtp_user: "${EMAIL_SMTP_USER}"
    smtp_password: "${EMAIL_SMTP_PASSWORD}"
    use_tls: true
    from_addr: automation@yourcompany.com
    to_addrs:
      - qa@yourcompany.com
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
